output_id: missoula-investor-report
version: 1
property_manager: missoula
title_template: '{property} - Investor Report - {period_label}'
sources:
  pm:
    schema: rentmanager-missoula
    role: pm_source
  cs_bs:
    schema: cornerstone-qbo
    role: cornerstone_balance_sheet
  cs_pl:
    schema: cornerstone-qbo
    role: cornerstone_profit_loss_ytd
  cs_dist:
    schema: cornerstone-qbo
    role: cornerstone_distribution_schedule
    required: false
flow:
- address: cs_bs:balance_sheet
  bookmark: Balance Sheet (Cornerstone)
- address: cs_pl:profit_loss_ytd_comparison
  bookmark: Profit & Loss YTD Comparison (Cornerstone)
- address: cs_dist:investor_distribution_schedule
  bookmark: Investor Distributions
  required: false
- for_each_record:
  - address: pm:profit_loss_comparison@{record}
    bookmark: Profit & Loss Comparison - {record_name}
  - address: pm:unit_availability@{record}
    bookmark: Unit Availability - {record_name}
- address: pm:owner_statement
  bookmark: Owner Statement
unmapped_policy: explicit_drop
drop:
- pm:financial_statement
- pm:rent_roll_analysis
- pm:general_ledger
- pm:actual_budget_fy_analysis
- pm:rent_roll_bank
- pm:delinquency
- pm:balance_sheet
- pm:not_a_real_section
transforms:
  ocr_if_no_text: true
  autorotate: true
  add_bookmarks: true
