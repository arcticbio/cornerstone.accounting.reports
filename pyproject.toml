[project]
name = "crr"
version = "0.1.0"
description = "Cornerstone Report Runner — assembles quarterly investor report PDFs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "google-api-python-client>=2.147",
    "google-auth>=2.35",
]

[project.scripts]
crr = "crr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "reportlab>=4.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crr"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. docs/ and the bundle are prose and fixtures,
# not source; SPEC.md is authoritative and must not churn under the formatter.
extend-exclude = ["docs", "data", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "googleapiclient.*", "google.oauth2.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "api: needs a live Anthropic key; skipped without one",
    "gdrive: needs Google service-account credentials; skipped without them",
]

[tool.coverage.run]
source = ["src/crr"]
branch = true
