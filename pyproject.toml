[project]
name = "crr"
version = "1.0.0"
description = "Cornerstone Report Runner — assembles quarterly investor report PDFs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
]

[project.scripts]
crr = "crr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff >= 0.16 formats python code fences inside markdown; docs/ is prose, not code.
extend-exclude = ["*.md", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "googleapiclient.*", "google.oauth2.*", "google.auth.*", "reportlab.*", "ocrmypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "api: needs ANTHROPIC_API_KEY; hits the real model",
    "gdrive: needs Google service-account credentials",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/crr"]
omit = ["src/crr/repository/google_drive.py", "src/crr/cli.py"]
