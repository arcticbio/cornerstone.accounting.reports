name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd ocrmypdf ghostscript
          tesseract --version | head -1
          ocrmypdf --version
          gs --version

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov=src/crr --cov-report=term-missing

      - name: Validate config
        run: uv run crr validate-config

      - name: Offline eval gate
        run: uv run crr eval --classifier golden --gate
