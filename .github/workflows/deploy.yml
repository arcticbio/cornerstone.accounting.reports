name: Deploy to Azure

# Deploys the Container Apps Job from infra/main.bicep (SPEC §14, D-13).
#
# Everything it needs comes from repository variables and secrets, so a normal deploy is
# "Run workflow" with no typing. docs/SETUP-AZURE.md is the one-time setup.
#
# Without AZURE_CREDENTIALS this workflow simply cannot sign in; the template is still
# compiled on every push by the `bicep` job in ci.yml, because a template that does not
# compile is a bug whether or not anyone can deploy it.

on:
  workflow_dispatch:
    inputs:
      what_if_only:
        description: "Preview the changes without applying them"
        required: true
        default: true
        type: boolean
      image:
        description: "Container image to run (blank = vars.CRR_IMAGE, else :build-v1)"
        required: false
        type: string
      resource_group:
        description: "Resource group (blank = vars.AZURE_RESOURCE_GROUP)"
        required: false
        type: string
      key_vault_name:
        description: "Key Vault name (blank = vars.AZURE_KEY_VAULT_NAME)"
        required: false
        type: string
      grant_key_vault_access:
        description: "Try to grant the job's identity read access to the vault after deploying"
        required: true
        default: true
        type: boolean
      schedule_enabled:
        description: "Arm the quarterly cron (untick to deploy the job without a schedule)"
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    name: az deployment group create
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Compile before touching Azure: a template error should cost nothing.
      - name: Compile the template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Resolve settings
        id: settings
        env:
          IN_RG: ${{ inputs.resource_group }}
          IN_KV: ${{ inputs.key_vault_name }}
          IN_IMAGE: ${{ inputs.image }}
          VAR_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          VAR_KV: ${{ vars.AZURE_KEY_VAULT_NAME }}
          VAR_IMAGE: ${{ vars.CRR_IMAGE }}
          VAR_GDRIVE: ${{ vars.CRR_GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          rg="${IN_RG:-$VAR_RG}"
          kv="${IN_KV:-$VAR_KV}"
          image="${IN_IMAGE:-${VAR_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crr:build-v1}}"
          missing=""
          [ -n "$rg" ]           || missing="$missing AZURE_RESOURCE_GROUP"
          [ -n "$kv" ]           || missing="$missing AZURE_KEY_VAULT_NAME"
          [ -n "$VAR_GDRIVE" ]   || missing="$missing CRR_GDRIVE_ROOT_FOLDER_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository variables::Set these under Settings → Secrets and variables → Actions → Variables:$missing. See docs/SETUP-AZURE.md."
            exit 1
          fi
          {
            echo "resource_group=$rg"
            echo "key_vault_name=$kv"
            echo "image=$image"
            echo "gdrive=$VAR_GDRIVE"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $image into $rg, secrets from $kv"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build the parameter list
        id: params
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          params=(
            "keyVaultName=${{ steps.settings.outputs.key_vault_name }}"
            "gdriveRootFolderId=${{ steps.settings.outputs.gdrive }}"
            "image=${{ steps.settings.outputs.image }}"
            "scheduleEnabled=${{ inputs.schedule_enabled }}"
          )
          # Only needed when the GHCR package is private (docs/SETUP-AZURE.md, step 4).
          if [ -n "${GHCR_USER}" ]; then
            params+=("registryUsername=${GHCR_USER}" "registryPassword=${GHCR_TOKEN}")
            echo "GHCR pull credentials: supplied"
          else
            echo "GHCR pull credentials: none (the image must be public)"
          fi
          printf '%s\n' "${params[@]}" > /tmp/crr-params.txt

      - name: What-if
        run: |
          set -euo pipefail
          mapfile -t params < /tmp/crr-params.txt
          az deployment group what-if \
            --resource-group "${{ steps.settings.outputs.resource_group }}" \
            --template-file infra/main.bicep \
            --parameters "${params[@]}"

      - name: Deploy
        if: ${{ !inputs.what_if_only }}
        id: deploy
        run: |
          set -euo pipefail
          mapfile -t params < /tmp/crr-params.txt
          name="crr-$(date +%Y%m%d%H%M%S)"
          az deployment group create \
            --resource-group "${{ steps.settings.outputs.resource_group }}" \
            --name "$name" \
            --template-file infra/main.bicep \
            --parameters "${params[@]}" \
            --output none
          principal=$(az deployment group show \
            --resource-group "${{ steps.settings.outputs.resource_group }}" \
            --name "$name" --query properties.outputs.principalId.value -o tsv)
          job=$(az deployment group show \
            --resource-group "${{ steps.settings.outputs.resource_group }}" \
            --name "$name" --query properties.outputs.jobName.value -o tsv)
          echo "principal_id=$principal" >> "$GITHUB_OUTPUT"
          echo "job_name=$job" >> "$GITHUB_OUTPUT"
          echo "Deployed job $job; its identity is $principal"

      # The job's managed identity does not exist until the job does, so this cannot be part
      # of the template. It needs User Access Administrator (or Owner) on the vault; if the
      # service principal does not have that, the run continues and prints the command.
      - name: Grant the job read access to Key Vault
        if: ${{ !inputs.what_if_only && inputs.grant_key_vault_access }}
        continue-on-error: true
        id: grant
        env:
          KV: ${{ steps.settings.outputs.key_vault_name }}
          PRINCIPAL: ${{ steps.deploy.outputs.principal_id }}
        run: |
          set -uo pipefail
          vault=$(az keyvault show -n "$KV" --query id -o tsv)

          # Contributor can read role assignments even though it cannot write them, so ask
          # before telling: whoever granted this by hand should not be nagged to do it again.
          # --include-inherited because a grant at the group or subscription scope works too.
          reads_secrets() {
            az role assignment list --scope "$vault" --include-inherited \
              --query "[?principalId=='$PRINCIPAL' && contains(['Key Vault Secrets User','Key Vault Secrets Officer','Key Vault Administrator'], roleDefinitionName)] | length(@)" \
              -o tsv 2>/dev/null || echo 0
          }

          if [ "$(reads_secrets)" != "0" ]; then
            echo "granted=true" >> "$GITHUB_OUTPUT"
            echo "The job's identity can already read $KV — nothing to do."
            exit 0
          fi

          if az role assignment create \
               --assignee-object-id "$PRINCIPAL" \
               --assignee-principal-type ServicePrincipal \
               --role "Key Vault Secrets User" \
               --scope "$vault" \
               --output none; then
            echo "granted=true" >> "$GITHUB_OUTPUT"
            echo "Granted 'Key Vault Secrets User' on $vault"
          else
            echo "granted=false" >> "$GITHUB_OUTPUT"
            echo "Could not hand out the role — this service principal is not a User Access Administrator."
          fi

      - name: What to do next
        if: ${{ !inputs.what_if_only }}
        run: |
          if [ "${{ steps.grant.outputs.granted }}" != "true" ]; then
            echo "::warning title=Grant Key Vault access by hand::The job's identity cannot read ${{ steps.settings.outputs.key_vault_name }} yet. Run: az role assignment create --assignee-object-id ${{ steps.deploy.outputs.principal_id }} --assignee-principal-type ServicePrincipal --role 'Key Vault Secrets User' --scope \$(az keyvault show -n ${{ steps.settings.outputs.key_vault_name }} --query id -o tsv) — or do it in the portal (docs/SETUP-AZURE-PORTAL.md part 4), then re-run this workflow so the job picks up the secrets it can now read. See docs/SETUP-AZURE.md step 6."
          fi
          echo "::notice title=Smoke test the job::az containerapp job start --name ${{ steps.deploy.outputs.job_name }} --resource-group ${{ steps.settings.outputs.resource_group }} --args version"
